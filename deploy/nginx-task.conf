# Add these blocks INSIDE the existing `server { ... }` for sameer.cloud
# (e.g. /etc/nginx/sites-available/sameer.cloud). They only claim /task and
# /taskmanager and do not affect the root site or any other location.
#
# Files are expected at /var/www/sameer-cloud-task (the contents of dist/).

location = /task { return 301 /task/; }
location ^~ /task/ {
    alias /var/www/sameer-cloud-task/;
    index index.html;
    # The app is a single page with no client-side routes, so no rewrites are needed.
    add_header Cache-Control "no-cache" always;
}
location ^~ /task/assets/ {
    alias /var/www/sameer-cloud-task/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Optional alias: sameer.cloud/taskmanager -> sameer.cloud/task/
location = /taskmanager { return 301 /task/; }
location ^~ /taskmanager/ { return 301 /task/; }
